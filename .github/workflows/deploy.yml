name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: add a repository secret named SITE_PASSWORD to password-protect the site.
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Password-protect pages (only if SITE_PASSWORD is set)
        if: env.SITE_PASSWORD != ''
        working-directory: dist
        run: |
          npx --yes staticrypt@3 . -r -d . \
            -p "$SITE_PASSWORD" \
            --short \
            --remember 30 \
            --template-title "AttentionLab" \
            --template-instructions "This site is not public yet. Please enter the password."
          rm -f .staticrypt.json
          echo "HTML files after encryption:"
          find . -name '*.html'
          # Fail the deploy rather than publish unprotected pages.
          if ! grep -qi staticrypt index.html; then
            echo "::error::index.html is not encrypted - aborting deploy"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
