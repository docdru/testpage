# One-time helper: downloads the images of focus-watch.com into the repo.
# Delete this file after it has run.
name: Fetch FocusWatch images

on:
  push:
    branches: [focuswatch-rebuild]
    paths: ['.github/workflows/fetch-images.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          set -e
          d=src/content/images
          mkdir -p "$d"
          get() { curl -fsSL --retry 3 "https://focus-watch.com/$1" -o "$d/$2"; }
          get logo.png logo.png
          get mockups/on_wrist.jpg on-wrist.jpg
          for f in navigation pomodoro writing checklists_list checklist levelup; do
            get "screenshots/Watch/$f.png" "watch-${f//_/-}.png"
          done
          for f in checklists_list calendar checklists_editor wizard; do
            get "screenshots/Companion/$f.png" "app-${f//_/-}.png"
          done
          cp "$d/logo.png" public/favicon.png
          ls -la "$d"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/content/images public/favicon.png
          git commit -m "Add images from focus-watch.com"
          git push
